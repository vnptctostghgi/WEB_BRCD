name: vnptcto

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vnptcto/backend:local
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_PUBLIC_URL: https://vnptcto.com
      APP_DATABASE_BACKEND: supabase
      DATA_MINING_DOWNLOAD_DIR: /app/data/data_mining_downloads
    init: true
    restart: unless-stopped
    volumes:
      - app_data:/app/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - origin
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ping', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VNPTCTO_LOCAL_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - origin
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    networks:
      - origin
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  origin:
    driver: bridge

volumes:
  app_data:
